<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Palindrome Checker</title>
  <link rel="stylesheet" href="palindrome.css" />
</head>
<body>
  <h1>Palindrome Checker</h1>
  <div class="card">
    <label for="text-input">Enter a word or phrase:</label>
    <div class="input-row">
      <input type="text" id="text-input" placeholder="e.g. race car" />
      <button id="check-btn">Check</button>
    </div>
    <div id="result"></div>
  </div>
  <script src="palindrome.js"></script>
</body>
</html>
